<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5f7">
    <meta
      name="description"
      content="SmithSphere 史密斯球：把完整复阻抗平面映射到球面，并用正、负电阻区两张圆图精确读取。"
    >
    <title>SmithSphere 史密斯球</title>
    <base data-trunk-public-url>
    <link data-trunk rel="copy-file" href="favicon.svg">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link
      data-trunk
      rel="rust"
      href="../crates/smith-sphere-gui/Cargo.toml"
      data-bin="smith-sphere-gui"
      data-wasm-opt="2"
    >
    <style>
      :root {
        color-scheme: light;
        background: #f4f5f7;
        font-family: "Noto Sans CJK SC", system-ui, sans-serif;
      }

      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #startup_status {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        color: #5f6670;
        background: #f4f5f7;
        letter-spacing: 0.02em;
      }

      #startup_status::before {
        width: 2rem;
        height: 2rem;
        margin: auto;
        content: "";
        border: 2px solid #d9dde3;
        border-top-color: #4a6fa5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <p id="canvas_instructions" class="visually-hidden">
      SmithSphere 交互画布。使用 Tab 与 Shift+Tab 在控件间移动，Enter 或空格激活控件，
      左右方向键移动频率滑块。
    </p>
    <canvas
      id="smith_sphere_canvas"
      tabindex="0"
      role="application"
      aria-label="SmithSphere 史密斯球工作区"
      aria-describedby="canvas_instructions"
    ></canvas>
    <div id="startup_status">
      <noscript>需要启用 JavaScript 与 WebAssembly。</noscript>
      <span>正在加载史密斯球</span>
    </div>
  </body>
</html>
